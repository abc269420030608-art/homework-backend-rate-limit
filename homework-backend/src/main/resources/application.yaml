spring:
  application:
    name: demo
  datasource:
    url: jdbc:mysql://localhost:3306/taskdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: taskuser
    password: taskpass
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  sql:
    init:
      mode: always

rocketmq:
  name-server: localhost:9876
  topic:
    rate-limit-events: rate-limit-events
    operation-error-events: operation-error-events
    rate-limit-operation-events: rate-limit-operation-events
